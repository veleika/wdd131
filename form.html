<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta name="description" content="Product Review Form for WDD 131 Dynamic Web Fundamentals.">
<meta name="author" content="Liekina Veleika">

<title>Product Review Form | WDD 131</title>

<link rel="stylesheet" href="styles/form.css">
<script src="scripts/form.js" defer></script>


</head>

<body>


<header>
    <h1>Product Review</h1>
</header>

<main>
    <form method="get" action="review.html">

        <fieldset>
            <legend>Product Information</legend>

            <label for="product">
                Product Name <span class="required">*</span>
            </label>

            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <p class="required-note">
                <span class="required">*</span> Required field
            </p>
        </fieldset>

        <fieldset>
            <legend>Overall Rating <span class="required">*</span></legend>

            <div class="rating">
                <label for="rating1">
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    <span>☆</span>
                    <small>1</small>
                </label>

                <label for="rating2">
                    <input type="radio" id="rating2" name="rating" value="2">
                    <span>☆☆</span>
                    <small>2</small>
                </label>

                <label for="rating3">
                    <input type="radio" id="rating3" name="rating" value="3">
                    <span>☆☆☆</span>
                    <small>3</small>
                </label>

                <label for="rating4">
                    <input type="radio" id="rating4" name="rating" value="4">
                    <span>☆☆☆☆</span>
                    <small>4</small>
                </label>

                <label for="rating5">
                    <input type="radio" id="rating5" name="rating" value="5">
                    <span>☆☆☆☆☆</span>
                    <small>5</small>
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Installation</legend>

            <label for="installation">
                Date of Installation <span class="required">*</span>
            </label>

            <input
                type="date"
                id="installation"
                name="installation"
                required
            >
        </fieldset>

        <fieldset>
            <legend>Useful Features</legend>

            <p>Select all that apply:</p>

            <div class="checkbox-group">

                <label for="feature1">
                    <input
                        type="checkbox"
                        id="feature1"
                        name="features"
                        value="durability"
                    >
                    Durability
                </label>

                <label for="feature2">
                    <input
                        type="checkbox"
                        id="feature2"
                        name="features"
                        value="ease-of-use"
                    >
                    Ease of Use
                </label>

                <label for="feature3">
                    <input
                        type="checkbox"
                        id="feature3"
                        name="features"
                        value="performance"
                    >
                    Performance
                </label>

                <label for="feature4">
                    <input
                        type="checkbox"
                        id="feature4"
                        name="features"
                        value="design"
                    >
                    Design
                </label>

            </div>
        </fieldset>

        <fieldset>
            <legend>Written Review</legend>

            <label for="review">
                Your Review
            </label>

            <textarea
                id="review"
                name="review"
                rows="6"
                placeholder="Write your review here..."
            ></textarea>
        </fieldset>

        <fieldset>
            <legend>Your Information</legend>

            <label for="username">
                Your Name
            </label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="name"
                placeholder="Enter your name"
            >
        </fieldset>

        <input
            type="submit"
            value="Submit Review"
            class="submit-button"
        >

    </form>
</main>

<footer>
    <p>
        &copy; <span id="currentyear"></span>
        Liekina Veleika | Tonga
    </p>

    <p id="lastModified"></p>
</footer>


</body>
</html>
